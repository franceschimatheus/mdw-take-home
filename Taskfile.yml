version: '3'

tasks:
  default:
    desc: Lists all available tasks
    cmds:
      - task --list

  up:
    desc: Builds and runs the app (localhost:3000) and the Inngest Dev Server (localhost:8288) in Docker
    cmds:
      - docker compose up --build

  down:
    desc: Stops the Docker containers
    cmds:
      - docker compose down

  test:docker:
    desc: Type-checks, lints and runs the unit tests in Docker
    cmds:
      - docker compose run --rm --build test

  install:
    desc: Installs dependencies (also downloads the Inngest Dev Server binary)
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install

  dev:
    desc: Runs the app (localhost:3000) and the Inngest Dev Server (localhost:8288) without Docker
    deps: [install]
    cmds:
      - task: run

  dev:playground:
    desc: Runs the playground (live progress + fault injection, see playground/README.md) and the Inngest Dev Server
    dir: playground
    cmds:
      - pnpm install
      - task: run
        vars: { DIR: playground }

  stop:
    desc: Kills leftover local dev servers (Next.js on :3000, Inngest Dev Server on :8288)
    silent: true
    # `ss` on Linux (lsof misses Next's IPv6 listener on WSL), lsof on macOS.
    # `env kill` because Task's built-in shell has no kill.
    cmds:
      - |
        listeners() {
          if command -v ss >/dev/null; then
            ss -ltnpH '( sport = :3000 or sport = :8288 )' | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u
          else
            lsof -t -i tcp:3000 -i tcp:8288 -sTCP:LISTEN || true
          fi
        }
        pids=$(listeners)
        if [ -z "$pids" ]; then echo "Nothing listening on :3000 or :8288"; exit 0; fi
        echo "Stopping $(echo $pids)"
        env kill $pids
        sleep 2
        pids=$(listeners)
        if [ -n "$pids" ]; then echo "Force-killing $(echo $pids)"; env kill -9 $pids; fi
        echo "Stopped"

  dev:email:
    desc: Runs the React Email preview server (http://localhost:3001)
    cmds:
      - pnpm email:dev

  test:
    desc: Runs the unit tests
    cmds:
      - pnpm test

  lint:
    desc: Lints and checks formatting
    cmds:
      - pnpm lint
      - pnpm format:check

  format:
    desc: Applies ESLint auto-fixes (import order, type imports), then formats
    cmds:
      - pnpm lint:fix
      - pnpm format

  audit:
    desc: Audits dependencies for known vulnerabilities (moderate severity and above)
    cmds:
      - pnpm audit --audit-level moderate

  check:
    desc: Lints, audits, type-checks, tests and builds, like CI
    cmds:
      - task: lint
      - task: audit
      - pnpm type-check
      - pnpm test
      - pnpm build

  run:
    internal: true
    deps:
      - task: next
        vars: { DIR: '{{.DIR}}' }
      - task: inngest
        vars: { DIR: '{{.DIR}}' }

  next:
    internal: true
    dir: '{{.DIR | default "."}}'
    cmds:
      - pnpm dev

  inngest:
    internal: true
    dir: '{{.DIR | default "."}}'
    cmds:
      - pnpm dev:inngest
