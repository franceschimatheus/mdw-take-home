name: Set up
description: Installs pnpm, Node and the app dependencies (pnpm store cached by lockfile).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.9.0

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - shell: bash
      run: pnpm install --frozen-lockfile
